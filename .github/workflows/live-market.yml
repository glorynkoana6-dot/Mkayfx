name: Mkayfx Live Market Analysis

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run market analysis
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python analyzer.py

      - name: Save market data and permanent signal history
        run: |
          git config user.name "Mkayfx Bot"
          git config user.email "actions@github.com"

          git add data.json signal_history.json

          if git diff --cached --quiet; then
            echo "No market-data changes"
          else
            git commit -m "Update live market analysis"
            git pull --rebase origin main
            git push
          fi